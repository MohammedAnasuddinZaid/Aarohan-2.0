name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: the pipeline only needs to read the repo.
permissions:
  contents: read

jobs:
  frontend:
    name: Next.js — typecheck, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Unit + retrieval evaluation
        run: npm test
      - name: RAG recall/MRR evaluation
        run: npm run eval:rag
      - name: Production build
        run: npm run build
        env:
          # The build must not depend on real secrets or localhost backends.
          NEXT_TELEMETRY_DISABLED: "1"

  backend:
    name: VoiceLink — pytest
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      # sherpa-onnx / onnxruntime ship manylinux wheels; no GPU or model files
      # are required because the unit tests stub the engines.
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  audit:
    name: Dependency audit (advisory, non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Advisory only: a pre-existing transitive advisory must not block a
      # legitimate fix. Review the output; do not treat green as "no CVEs".
      - run: npm audit --audit-level=high
